name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Doc
        run: cargo doc --no-deps --all-features

      - name: Package
        run: cargo package

  parity:
    name: rpc parity gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - uses: Swatinem/rust-cache@v2

      # Fails if the crate invokes or serves an RPC method that is not declared
      # in schemas/api.schema.json and is not a documented off-schema exception,
      # or if a previously bound method regressed to unbound.
      - name: RPC parity gate
        run: cargo test --test rpc_parity -- --nocapture

      # Fails if src/generated/methods.rs was hand-edited or has drifted from
      # the vendored schema. The generated registry must always be reproducible.
      - name: Codegen drift check
        run: |
          cargo run --manifest-path codegen/Cargo.toml
          git diff --exit-code -- src/generated/methods.rs
