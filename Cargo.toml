[package]
name = "copilot-sdk"
version = "3.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Rust SDK for GitHub Copilot CLI"
repository = "https://github.com/github-community/copilot-sdk-rust"
documentation = "https://docs.rs/copilot-sdk"
readme = "README.md"
keywords = ["copilot", "github", "ai", "sdk"]
categories = ["api-bindings", "asynchronous"]
exclude = [
    "website/",
    ".github/",
    ".githooks/",
    "docs/",
    "scripts/",
    "codegen/",
    "schemas/",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "process",
    "sync",
    "io-util",
    "io-std",
    "macros",
    "time",
] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# DateTime handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Executable finding
which = "8"

schemars = { version = "1.2", optional = true, features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"
tempfile = "3"
futures = "0.3"
rand = "0.10"
serde_yaml = "0.9"
regex = "1"

[features]
default = []
e2e = []  # Enable E2E tests that require real Copilot CLI
snapshots = [] # Enable snapshot-based conformance tests
schemars = ["dep:schemars"] # Derive tool JSON schemas from Rust types

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

